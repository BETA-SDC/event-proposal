name: 文档维护
description: 修正、补充、整理或同步已有文档
title: "[docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        如果核心是改变组织以后做事的方式，请使用“内部改进提议”模板；本模板只用于维护已有文档。可以先记录问题，具体修改内容后续补充。
  - type: input
    id: document
    attributes:
      label: 目标文档
      placeholder: 文档路径或链接
  - type: textarea
    id: change
    attributes:
      label: 需要修改的内容
      placeholder: 请说明需要修正、补充或整理的部分。
  - type: textarea
    id: reason
    attributes:
      label: 修改原因
      placeholder: 例如：信息过期、链接失效、表述不清或流程已有变更。
  - type: input
    id: proposer
    attributes:
      label: 提议人
      placeholder: "@用户名"
