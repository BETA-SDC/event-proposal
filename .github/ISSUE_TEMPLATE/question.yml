name: 问题讨论
description: 提出临时问题、待确认事项或需要集体讨论的话题
title: "[question] "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: 问题或待确认事项
      placeholder: 请清楚描述需要讨论或确认的内容。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景和上下文
      placeholder: 请补充相关活动、文档、链接或已有讨论。
  - type: textarea
    id: expected
    attributes:
      label: 希望得到的结论
      placeholder: 需要做出什么决定，或确认什么信息？
